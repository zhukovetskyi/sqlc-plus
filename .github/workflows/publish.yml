name: Release workflow

on:
  push:
    tags:
      - 'v**'
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npx @vscode/vsce publish --oidc
